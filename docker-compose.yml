services:
  postgres:
    image: postgres:15-alpine
    container_name: stakegood_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stakegood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stakegood_pass}
      POSTGRES_DB: ${DB_NAME:-stakegood_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-stakegood} -d ${DB_NAME:-stakegood_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
